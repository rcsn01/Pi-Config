name: Pi extensions

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    defaults:
      run:
        working-directory: .pi

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.1
          cache: pnpm
          cache-dependency-path: .pi/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck extensions
        run: pnpm typecheck

      - name: Test extensions
        run: pnpm test

      - name: Test Plan Bash OS sandbox
        if: runner.os == 'macOS'
        env:
          RUN_PLAN_SANDBOX_INTEGRATION: "1"
        run: pnpm vitest run extensions/workflows-plan-mode/plan-sandbox.integration.test.ts
